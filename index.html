<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiFi CSI 实时电磁环境检测</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>WiFi CSI 实时电磁环境检测</h1>
          <p>ESP32-C5 · 5 GHz Channel 40 · 一键监测</p>
        </div>
        <div class="status-pill" id="serialStatus">串口未连接</div>
      </header>

      <section class="hero-panel" aria-label="实时判断">
        <div class="judgement idle" id="presenceState">未开始</div>
        <p id="presenceText">点击开始监测。前 10 秒保持环境稳定，页面会自动建立电磁基线。</p>
        <div class="change-meter" aria-label="电磁环境变化强度">
          <div class="meter-head">
            <span>综合提醒</span>
            <strong><span id="presenceScore">0</span>/100</strong>
          </div>
          <div class="score-bar"><span id="scoreFill"></span></div>
        </div>
      </section>

      <button id="mainButton" class="main-button">开始监测</button>

      <section class="alert-grid" aria-label="三层判定提醒">
        <article class="alert-card idle" id="changeCard">
          <span>第一层</span>
          <strong id="changeStatus">未开始</strong>
          <p id="changeText">实时电磁环境变化</p>
          <small>分数 <b id="changeScore">0</b> / 阈值 <b id="changeThreshold">--</b></small>
        </article>
        <article class="alert-card idle" id="paperCard">
          <span>第二层</span>
          <strong id="paperStatus">未开始</strong>
          <p id="paperText">Doppler / NMI 人体活动确认</p>
          <small>分数 <b id="paperScore">0</b> / 阈值 <b id="paperThreshold">--</b></small>
        </article>
        <article class="alert-card idle" id="combinedCard">
          <span>综合</span>
          <strong id="combinedStatus">未开始</strong>
          <p id="combinedText">任一层连续触发即提醒</p>
          <small>分数 <b id="combinedScore">0</b> / 阈值 <b id="combinedThreshold">连续确认</b></small>
        </article>
      </section>

      <section class="info-grid" aria-label="实时状态">
        <div>
          <span>基线状态</span>
          <strong id="calibStatus">未建立</strong>
        </div>
        <div>
          <span>实时 CSI 包</span>
          <strong id="packetCount">0</strong>
        </div>
        <div>
          <span>RSSI</span>
          <strong id="rssiValue">--</strong>
        </div>
        <div>
          <span>幅度偏移</span>
          <strong id="ampShift">0.00</strong>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
